name: ✨ 功能建议 · Feature request
description: 提出一个想法 / Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与痛点 · Problem
      description: 你在什么场景下遇到了什么问题?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案 · Proposed solution
      description: 你希望 Pinery 怎么做?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 · Alternatives
      description: 考虑过的其他做法(可留空)
  - type: checkboxes
    id: pr
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意为这个功能提 PR / I'm willing to submit a PR
